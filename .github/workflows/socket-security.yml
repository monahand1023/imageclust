name: Socket Security

on:
  pull_request:
  push:
    branches: [main]

jobs:
  socket_security_go:
    name: Socket Security (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Socket CLI
        run: npm install -g @socket.dev/cli
      - name: Socket Security Scan
        run: socket ci
        env:
          SOCKET_API_TOKEN: ${{ secrets.SOCKET_API_TOKEN }}

  socket_security_npm:
    name: Socket Security (frontend npm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Socket CLI
        run: npm install -g @socket.dev/cli
      - name: Socket Security Scan
        run: socket ci
        env:
          SOCKET_API_TOKEN: ${{ secrets.SOCKET_API_TOKEN }}
